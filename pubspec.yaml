name: mypocket
description: 'A multi-functional personal assistant app built with Flutter.'

version: 1.0.0+1

environment:
    sdk: ^3.9.2

dependencies:
    shared_preferences: ^2.2.2
    flutter:
        sdk: flutter
    cupertino_icons: ^1.0.8
    url_launcher: ^6.2.6
    provider: ^6.1.2
    fl_chart: ^0.66.2
    audioplayers: ^5.2.1
    intl: ^0.19.0

dev_dependencies:
    flutter_test:
        sdk: flutter
    build_runner: ^2.3.3
    flutter_launcher_icons: ^0.13.1

    flutter_lints: ^5.0.0

flutter:
    uses-material-design: true

    assets:
        - assets/icons/app_icon.png
        - assets/icons/
        - assets/fonts/ArcadeClassic.ttf
    fonts:
        - family: Arcade
          fonts:
              - asset: assets/fonts/ArcadeClassic.ttf

flutter_icons:
    android: true
    ios: true
    image_path: 'assets/icons/app_icon.png'
    remove_alpha_ios: true
    adaptive_icon_background: 'assets/icons/app_icon.png'
